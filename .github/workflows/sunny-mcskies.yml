name: Sunny McSkies Daily Forecast

on:
  schedule:
    - cron: '5 11 * * *'  # 6:05 AM Central = 11:05 UTC
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Run Sunny McSkies
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p data/logs
          cd src
          bash weather_broadcast.sh
